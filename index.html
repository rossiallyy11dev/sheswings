<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHE SWINGS - Where Champions Connect</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Oswald -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#2B8AC4',
                            lightBlue: '#54B2E6',
                            sky: '#E8F5FC',
                            navy: '#0C3248',
                            darkBlue: '#1C5B82'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Oswald', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth Scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Hero subtle gradient overlay */
        .hero-bg {
            background: linear-gradient(180deg, #F0F7FC 0%, #FFFFFF 100%);
            position: relative;
            overflow: hidden;
        }

        .hero-bg::after {
            content: '';
            position: absolute;
            bottom: -5%;
            right: -10%;
            width: 70%;
            height: 80%;
            background: radial-gradient(circle at 60% 60%, rgba(220, 240, 252, 0.6) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
        }

        /* Ticker Animation for Footer Banner */
        @keyframes banner-slide {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .animate-ticker {
            display: flex;
            width: 200%;
            animation: banner-slide 20s linear infinite;
        }

        .animate-ticker:hover {
            animation-play-state: paused;
        }
    </style>
</head>
<body class="font-sans text-slate-800 bg-white antialiased flex flex-col min-h-screen selection:bg-brand-lightBlue selection:text-white">

    <!-- ==================== STRIPE SESSIONS-STYLE NAVIGATION BAR ==================== -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-sky-100 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                
                <!-- Left: Text Brand Logo -->
                <div class="flex items-center">
                    <a href="#" class="font-heading text-2xl font-bold tracking-wider text-slate-900 hover:text-brand-blue transition-colors uppercase">
                        SHE <span class="text-brand-blue">SWINGS</span>
                    </a>
                </div>

                <!-- Right: Contact & Register CTA -->
                <nav class="flex items-center gap-6 sm:gap-8">
                    <a href="#contact" class="text-sm font-semibold text-slate-700 hover:text-brand-blue transition-colors">Contact</a>
                    <a href="#register" class="bg-brand-blue text-white px-6 py-2.5 rounded-full font-semibold text-sm shadow-sm hover:bg-brand-darkBlue transition duration-200">
                        Register
                    </a>
                </nav>

            </div>
        </div>
    </header>

    <main class="flex-grow">
        <!-- ==================== HERO SECTION ==================== -->
        <section id="home" class="hero-bg pt-8 pb-12 md:pt-16 md:pb-16 px-4 sm:px-6 lg:px-8 relative">
            <div class="max-w-7xl mx-auto relative z-10">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                    
                    <!-- Left Column: Copy & Action -->
                    <div class="lg:col-span-7 space-y-6 text-center lg:text-left">
                        
                        <!-- Headline -->
                        <h1 class="font-heading text-4xl sm:text-5xl lg:text-6xl tracking-tight leading-tight uppercase font-bold text-slate-900">
                            <span class="text-brand-lightBlue">SHE SWINGS:</span><br>
                            WHERE CHAMPIONS<br>
                            CONNECT.
                        </h1>

                        <!-- Body Paragraph -->
                        <p class="text-base sm:text-lg text-slate-600 max-w-2xl mx-auto lg:mx-0 leading-relaxed font-normal">
                            She Swings: where champions connect. We empower female golfers to connect, build community, and elevate their game.
                        </p>

                        <!-- Primary Action Button -->
                        <div class="pt-4 flex flex-wrap gap-4 justify-center lg:justify-start items-center">
                            <a href="#register" class="px-8 py-3.5 rounded-full border-2 border-brand-lightBlue text-brand-blue font-bold text-sm tracking-wider uppercase hover:bg-brand-blue hover:text-white hover:border-brand-blue transition-all duration-300 shadow-sm hover:shadow-md transform hover:-translate-y-0.5">
                                REGISTER NOW
                            </a>
                        </div>
                    </div>

                    <!-- Right Column: Visual Graphic Cutout -->
                    <div class="lg:col-span-5 relative flex justify-center items-center">
                        <div class="relative w-full max-w-md lg:max-w-none flex justify-center">
                            
                            <!-- Stylized Golf Course Background Graphic -->
                            <div class="absolute inset-0 flex items-end justify-between pointer-events-none opacity-40 -z-10">
                                <div class="text-slate-300 text-6xl">
                                    <i class="fa-solid fa-tree"></i>
                                    <i class="fa-solid fa-tree -ml-4"></i>
                                </div>
                                <div class="text-brand-lightBlue text-5xl mb-12 mr-6">
