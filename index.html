<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHE Swings</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #F8F8FA;
            color: #555555;
            padding: 0 16px 60px 16px;
            -webkit-font-smoothing: antialiased;
        }

        /* Seamless Top Nav / Floating Box on Scroll */
        .navbar {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin: 0 auto 48px auto;
            padding: 24px 8px 24px 12px;
            border-radius: 16px;
            background-color: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: 1px solid transparent;
            box-shadow: none;
            transition: all 0.25s ease-in-out;
        }

        .navbar.scrolled {
            top: 12px;
            padding: 12px 16px 12px 20px;
            background-color: rgba(238, 236, 240, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        /* Brand Logo with Weight Contrast */
        .brand-logo {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 1.25rem;
            color: #555555;
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .brand-logo .bold-text {
            font-weight: 700;
        }

        .brand-logo .light-text {
            font-weight: 400;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-link {
            font-family: 'Roboto', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: #555555;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .nav-link:hover {
            opacity: 0.6;
        }

        .btn-register {
            font-family: 'Roboto', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: #FFFFFF;
            background-color: #00AAEE;
            padding: 10px 24px;
            border-radius: 999px;
            text-decoration: none;
            transition: background-color 0.2s ease, opacity 0.2s ease;
        }

        .btn-register:hover {
            background-color: #0099D8;
        }

        /* Hero Layout */
        .hero-section {
            width: 100%;
            margin: 0 auto;
        }

        .hero-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            gap: 40px;
            padding: 0 12px;
        }

        .hero-headline {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: clamp(3.2rem, 5.8vw, 6rem);
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: -0.03em;
            max-width: 850px;
            color: #555555;
        }

        .hero-meta-group {
            display: flex;
            gap: 48px;
            padding-top: 16px;
            margin-right: 8%;
        }

        .meta-item {
            font-family: 'Roboto', sans-serif;
            font-size: 0.95rem;
            line-height: 1.4;
            color: #555555;
            font-weight: 400;
        }

        .hero-banner-container {
            width: 100%;
            height: 560px;
            background-color: #E8E8EC;
            border-radius: 28px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .hero-banner-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 900px) {
            body {
                padding: 0 12px 40px 12px;
            }
            .navbar {
                padding: 16px 8px;
            }
            .hero-header-row {
                flex-direction: column;
                gap: 24px;
                padding: 0;
            }
            .hero-meta-group {
                gap: 32px;
                margin-right: 0;
            }
            .hero-banner-container {
                height: 320px;
            }
        }
    </style>
</head>
<body>

    <header class="navbar" id="navbar">
        <a href="#" class="brand-logo">
            <span class="bold-text">SHE</span> <span class="light-text">Swings</span>
        </a>
        <div class="nav-right">
            <a href="#contact" class="nav-link">Contact</a>
            <a href="#register" class="btn-register">Register</a>
        </div>
    </header>

    <main class="hero-section">
        <div class="hero-header-row">
            <h1 class="hero-headline">
                Making a difference<br>on and off the course
            </h1>
            
            <div class="hero-meta-group">
                <div class="meta-item">
                    October 10–11,<br>2027
                </div>
                <div class="meta-item">
                    Oswego Lake Country Club,<br>Lake Oswego, Oregon
                </div>
            </div>
        </div>

        <div class="hero-banner-container">
            <img src="SHE Swings Official Logo.png" alt="SHE Swings Banner" class="hero-banner-image">
        </div>
    </main>

    <script>
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (nav) {
                if (window.scrollY > 20) {
                    nav.classList.add('scrolled');
                } else {
                    nav.classList.remove('scrolled');
                }
            }
        });
    </script>

</body>
</html>
