<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHE Swings</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #F8F8FA;
            color: #0A0A0E;
            padding: 0 40px 60px 40px;
            -webkit-font-smoothing: antialiased;
        }

        /* Floating Translucent Nav Container */
        .navbar {
            position: sticky;
            top: 16px;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            
            width: 100%;
            max-width: 1400px;
            margin: 0 auto 60px auto;
            padding: 12px 28px;
            border-radius: 16px;
            
            background-color: rgba(238, 236, 240, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            
            transition: all 0.3s ease;
        }

        .brand-logo {
            font-family: 'Archivo Narrow', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: #0A0A0E;
            text-decoration: none;
            letter-spacing: -0.02em;
            text-transform: lowercase;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-link {
            font-family: 'Roboto', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: #0A0A0E;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .nav-link:hover {
            opacity: 0.6;
        }

        .btn-register {
            font-family: 'Roboto', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: #FFFFFF;
            background-color: #120924;
            padding: 10px 24px;
            border-radius: 999px;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .btn-register:hover {
            background-color: #2D1F47;
        }

        /* Hero Main Layout */
        .hero-section {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .hero-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 48px;
            gap: 40px;
        }

        .hero-headline {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: clamp(3rem, 5.5vw, 5.5rem);
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: -0.03em;
            text-transform: lowercase;
            max-width: 800px;
            color: #120924;
        }

        /* Metadata alignment on right side */
        .hero-meta-group {
            display: flex;
            gap: 48px;
            padding-top: 16px;
        }

        .meta-item {
            font-family: 'Roboto', sans-serif;
            font-size: 0.95rem;
            line-height: 1.4;
            color: #2D2C35;
            font-weight: 400;
        }

        /* Rounded Hero Banner Box */
        .hero-banner-container {
            width: 100%;
            height: 520px;
            background-color: #E8E8EC;
            border-radius: 28px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .hero-banner-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Responsive adjustments */
        @media (max-width: 900px) {
            body {
                padding: 0 20px 40px 20px;
            }
            .navbar {
                top: 10px;
                padding: 10px 20px;
            }
            .hero-header-row {
                flex-direction: column;
                gap: 24px;
            }
            .hero-meta-group {
                gap: 32px;
            }
            .hero-banner-container {
                height: 320px;
            }
        }
    </style>
</head>
<body>

    <!-- Sticky Floating Shaded Nav Bar -->
    <header class="navbar">
        <a href="#" class="brand-logo">she swings</a>
        <div class="nav-right">
            <a href="#contact" class="nav-link">Contact</a>
            <a href="#register" class="btn-register">Register</a>
        </div>
    </header>

    <!-- Main Hero Section -->
    <main class="hero-section">
        <div class="hero-header-row">
            <h1 class="hero-headline">
                making a difference<br>on and off the course
            </h1>
            
            <div class="hero-meta-group">
                <div class="meta-item">
                    October 10–11,<br>2027
                </div>
                <div class="meta-item">
                    Oswego Lake Country Club,<br>Lake Oswego, Oregon
                </div>
            </div>
        </div>

        <!-- Hero Banner Container -->
        <div class="hero-banner-container">
            <img src="logo.png" alt="SHE Swings Banner" class="hero-banner-image">
        </div>
    </main>

</body>
</html>
