<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHE SWINGS - Where Champions Connect</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Oswald -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#2B8AC4',
                            lightBlue: '#54B2E6',
                            sky: '#E8F5FC',
                            navy: '#0C3248',
                            darkBlue: '#1C5B82'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Oswald', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth Scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Subtle curved background overlay mimicking golf course hill path */
        .hero-bg {
            background: linear-gradient(180deg, #F0F7FC 0%, #FFFFFF 100%);
            position: relative;
            overflow: hidden;
        }

        .hero-bg::after {
            content: '';
            position: absolute;
            bottom: -5%;
            right: -10%;
            width: 70%;
            height: 80%;
            background: radial-gradient(circle at 60% 60%, rgba(220, 240, 252, 0.6) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
        }

        /* Ticker Animation for Footer Banner */
        @keyframes banner-slide {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .animate-ticker {
            display: flex;
            width: 200%;
            animation: banner-slide 20s linear infinite;
        }

        .animate-ticker:hover {
            animation-play-state: paused;
        }
    </style>
</head>
