<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHE Swings</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #F8F8FA;
            color: #555555;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Full Edge-to-Edge Navbar with Balanced Scrolled Rectangle */
        .navbar {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin: 0 0 40px 0;
            padding: 24px 24px;
            background-color: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: 1px solid transparent;
            border-radius: 0;
            box-shadow: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .navbar.scrolled {
            top: 12px;
            width: calc(100% - 48px);
            margin: 0 auto 40px auto;
            padding: 11px 24px;
            background-color: rgba(238, 236, 240, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        /* Edge-to-Edge Inset Padding */
        .hero-section, .content-section, .registration-page {
            padding-left: 24px;
            padding-right: 24px;
            width: 100%;
        }

        /* Brand Logo */
        .brand-logo {
            font-family: 'Roboto', sans-serif;
            font-size: 1.25rem;
            color: #555555;
            text-decoration: none;
            letter-spacing: -0.02em;
            cursor: pointer;
        }

        .brand-logo .bold-text {
            font-weight: 700;
        }

        .brand-logo .light-text {
            font-weight: 400;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-link {
            font-family: 'Roboto', sans-serif;
            font-size: 0.95rem;
            font-weight: 400;
            color: #555555;
            text-decoration: none;
            transition: opacity 0.2s ease;
            cursor: pointer;
        }

        .nav-link:hover {
            opacity: 0.6;
        }

        /* Register Blue Pill Button */
        .btn-register {
            font-family: 'Roboto', sans-serif;
            font-size: 0.95rem;
            font-weight: 400;
            color: #FFFFFF;
            background-color: #00AAEE;
            padding: 9px 28px;
            border-radius: 999px;
            text-decoration: none;
            transition: background-color 0.2s ease, opacity 0.2s ease;
            display: inline-block;
            text-align: center;
            border: none;
            cursor: pointer;
        }

        .navbar.scrolled .btn-register {
            background-color: #00AAEE;
            padding: 8px 25px;
        }

        .navbar.scrolled .btn-register:hover {
            background-color: #0099D8;
        }

        .btn-register:hover {
            background-color: #0099D8;
        }

        /* Hero Layout */
        .hero-section {
            width: 100%;
            margin: 0 auto 64px auto;
        }

        .hero-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            gap: 40px;
            padding: 0;
        }

        .hero-headline {
            font-family: 'Roboto', sans-serif;
            font-size: clamp(3rem, 5.5vw, 5.5rem);
            font-weight: 400;
            line-height: 1.0;
            letter-spacing: -0.03em;
            max-width: 850px;
            color: #555555;
            margin-left: -3px;
        }

        .hero-meta-group {
            display: flex;
            gap: 48px;
            padding-top: 16px;
            margin-right: 8%;
        }

        .meta-item {
            font-family: 'Roboto', sans-serif;
            font-size: 0.95rem;
            line-height: 1.4;
            color: #555555;
            font-weight: 400;
        }

        .hero-banner-container {
            width: 100%;
            height: 560px;
            background-color: #E8E8EC;
            border-radius: 28px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .hero-banner-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            padding: 20px;
        }

        /* Section Dividers */
        .section-divider {
            width: calc(100% - 48px);
            height: 1px;
            background-color: rgba(0, 0, 0, 0.08);
            margin: 120px auto 16px auto;
        }

        /* Generic Section Layout */
        .content-section {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
        }

        .section-title {
            font-family: 'Roboto', sans-serif;
            font-size: clamp(2rem, 3.2vw, 3.2rem);
            font-weight: 400;
            color: #555555;
            letter-spacing: -0.02em;
            line-height: 1.1;
            white-space: nowrap;
            flex: 0 0 480px; 
            padding-right: 48px;
        }

        .section-right-content {
            display: flex;
            flex-direction: column;
            gap: 28px;
            flex: 1;
        }

        .section-text {
            font-family: 'Roboto', sans-serif;
            font-size: 1.6rem;
            line-height: 1.35;
            letter-spacing: -0.015em;
            font-weight: 400;
            max-width: 710px;
            color: #555555;
        }

        .guest-intro-text {
            font-family: 'Roboto', sans-serif;
            font-size: 1.05rem;
            line-height: 1.5;
            font-weight: 400;
            color: #555555;
            max-width: 540px;
            margin: 0;
        }

        .guest-media-container {
            width: 100%;
            max-width: 540px;
            height: 440px;
            background-color: #E8E8EC;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
            margin: 8px 0 0 0;
        }

        .sponsor-media-container {
            width: 100%;
            max-width: 785px;
            height: 500px;
            background-color: #E8E8EC;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
            margin: 8px 0 0 0;
        }

        .guest-media-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .about-media-container {
            width: 100%;
            max-width: 710px;
            height: 460px;
            background-color: #E8E8EC;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
            margin-top: 12px;
        }

        .about-media-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Agenda Section Layout */
        .agenda-list {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 750px;
        }

        .agenda-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 36px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .agenda-row:first-child {
            padding-top: 0;
        }

        .agenda-date-col {
            flex: 0 0 220px;
        }

        .agenda-date {
            font-family: 'Roboto', sans-serif;
            font-size: 1.35rem;
            font-weight: 500;
            color: #555555;
            margin-bottom: 8px;
        }

        .agenda-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.825rem;
            font-weight: 400;
            background-color: rgba(255, 255, 255, 0.7);
            color: #555555;
            padding: 3px 10px 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0, 0, 0, 0.12);
        }

        .rhombus-icon {
            width: 11px;
            height: 9px;
            background-color: #FF5522;
            transform: skewX(-20deg);
            border-radius: 1px;
            display: inline-block;
        }

        .agenda-events-col {
            flex: 1;
            font-family: 'Roboto', sans-serif;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555555;
            font-weight: 400;
        }

        .agenda-note {
            font-style: italic;
            margin-top: 8px;
            opacity: 0.8;
        }

        /* Sponsor Callout Card */
        .sponsor-card {
            width: 100%;
            max-width: 785px;
            background-color: #EEEEF2;
            border-radius: 16px;
            padding: 24px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.04);
            margin-top: 8px;
        }

        .sponsor-card-title {
            font-family: 'Roboto', sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: #555555;
            margin-bottom: 6px;
        }

        .sponsor-card-link {
            font-family: 'Roboto', sans-serif;
            font-size: 0.95rem;
            font-weight: 400;
            color: #00AAEE;
            text-decoration: none;
        }

        .sponsor-card-link:hover {
            text-decoration: underline;
        }

        .sponsor-arrow-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #E2E2E8;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555555;
            text-decoration: none;
            font-size: 1.1rem;
            transition: background-color 0.2s ease;
        }

        .sponsor-arrow-btn:hover {
            background-color: #D6D6DD;
        }

        /* FAQ Accordion Styling */
        .faq-list {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 785px;
        }

        .faq-item {
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            padding: 24px 0;
        }

        .faq-item:first-child {
            padding-top: 0;
        }

        .faq-item details {
            width: 100%;
        }

        .faq-item summary {
            font-family: 'Roboto', sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: #555555;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .faq-item summary::-webkit-details-marker {
            display: none;
        }

        .faq-toggle-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #E8E8EC;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: #555555;
            flex-shrink: 0;
            margin-left: 16px;
            transition: transform 0.2s ease;
        }

        .faq-item details[open] .faq-toggle-icon {
            transform: rotate(45deg);
        }

        .faq-answer {
            font-family: 'Roboto', sans-serif;
            font-size: 0.975rem;
            line-height: 1.6;
            color: #555555;
            padding-top: 16px;
            font-weight: 400;
        }

        .faq-answer a {
            color: #00AAEE;
            text-decoration: none;
        }

        .faq-answer a:hover {
            text-decoration: underline;
        }

        /* ------------------------------------------------ */
        /* REGISTRATION PAGE VIEW                           */
        /* ------------------------------------------------ */
        .registration-page {
            display: none;
            width: 100%;
            margin: 0 auto;
            padding-top: 10px;
        }

        .registration-page.active {
            display: block;
        }

        .reg-hero-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 60px;
            margin-bottom: 32px;
        }

        .reg-title-col {
            flex: 1;
            padding-top: 20px;
        }

        .reg-title {
            font-size: clamp(3.2rem, 5.5vw, 5.2rem);
            font-weight: 400;
            line-height: 0.98;
            letter-spacing: -0.035em;
            color: #1A0B2E;
        }

        .reg-image-container {
            width: 520px;
            height: 380px;
            border-radius: 24px;
            overflow: hidden;
            background-color: #E8E8EC;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .reg-image-placeholder {
            font-size: 0.95rem;
            color: #777788;
            font-weight: 400;
            text-align: center;
            padding: 20px;
        }

        .reg-meta-bar {
            display: flex;
            gap: 120px;
            padding-bottom: 32px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            margin-bottom: 48px;
            padding-top: 10px;
        }

        .reg-meta-item {
            font-size: 1.05rem;
            color: #555555;
            line-height: 1.45;
            font-weight: 400;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px 40px;
            margin-bottom: 48px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #1A0B2E;
        }

        .form-input, .form-select {
            width: 100%;
            height: 52px;
            padding: 0 18px;
            border-radius: 10px;
            border: 1px solid #E0E0E8;
            background-color: #F3F3F7;
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
            color: #1A0B2E;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .form-input:focus, .form-select:focus {
            border-color: #1A0B2E;
            background-color: #FFFFFF;
        }

        .form-select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%231A0B2E' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 16px center;
        }

        .field-subtext {
            font-size: 0.825rem;
            color: #777788;
            margin-top: 4px;
        }

        .form-divider-section {
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            padding-top: 36px;
            margin-top: 24px;
            margin-bottom: 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-question {
            font-size: 1.5rem;
            font-weight: 400;
            color: #1A0B2E;
            letter-spacing: -0.01em;
        }

        .radio-options {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            color: #1A0B2E;
            cursor: pointer;
        }

        .promo-code-box {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-apply {
            background-color: transparent;
            border: 1px solid #1A0B2E;
            color: #1A0B2E;
            padding: 0 24px;
            height: 52px;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-apply:hover {
            background-color: #1A0B2E;
            color: #FFFFFF;
        }

        .order-summary-section {
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            padding-top: 40px;
            margin-top: 48px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .summary-left-title {
            font-size: 2.2rem;
            font-weight: 400;
            color: #1A0B2E;
            letter-spacing: -0.02em;
        }

        .summary-right-details {
            width: 100%;
            max-width: 500px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            font-size: 1.1rem;
            color: #555555;
        }

        .summary-row.total {
            border-top: 1px solid #E0E0E6;
            font-size: 1.5rem;
            font-weight: 500;
            color: #1A0B2E;
            padding-top: 24px;
            margin-top: 12px;
        }

        .btn-submit-reg {
            background-color: #1A0B2E;
            color: #FFFFFF;
            font-size: 1.05rem;
            font-weight: 500;
            padding: 16px 48px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease;
            float: right;
            margin-top: 32px;
        }

        .btn-submit-reg:hover {
            background-color: #31135C;
        }

        /* ------------------------------------------------ */
        /* STRIPE-STYLE EXACT MATCH DARK FOOTER            */
        /* ------------------------------------------------ */
        .site-footer {
            background-color: #06010D;
            color: #FFFFFF;
            padding: 64px 60px 48px 60px;
            margin-top: 140px;
            width: 100%;
        }

        .footer-grid-layout {
            display: grid;
            grid-template-columns: 1fr 500px;
            gap: 60px;
            align-items: start;
            width: 100%;
        }

        .footer-left-col {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-self: stretch;
            height: 100%;
            min-height: 480px;
            margin-top: -32px;
            padding-top: 0;
        }

        .footer-brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: #FFFFFF;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            letter-spacing: -0.01em;
            margin-top: 0;
            padding-top: 0;
            line-height: 1.0;
            align-self: flex-start;
        }

        .footer-headline {
            font-size: clamp(3rem, 5.5vw, 5.5rem);
            font-weight: 400;
            line-height: 1.0;
            letter-spacing: -0.03em;
            color: #FFFFFF;
            max-width: 850px;
            margin-bottom: 0;
        }

        .footer-right-col {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .footer-meta-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 120px;
        }

        .footer-meta-item {
            font-size: 0.95rem;
            color: #FFFFFF;
            line-height: 1.45;
            font-weight: 400;
        }

        .footer-section-group {
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 16px;
            margin-bottom: 40px;
        }

        .footer-section-title {
            font-size: 0.9rem;
            font-weight: 400;
            color: #7E7E91;
            margin-bottom: 12px;
            letter-spacing: 0.01em;
        }

        .footer-link-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .footer-link {
            color: #FFFFFF;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 400;
            transition: opacity 0.2s ease;
        }

        .footer-link:hover {
            opacity: 0.7;
            text-decoration: underline;
        }

        /* Footer White Space Container */
        .footer-media-container {
            width: 100%;
            height: 200px;
            background-color: #FFFFFF;
        }

        /* Payment Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .payment-modal {
            background: #FFFFFF;
            border-radius: 20px;
            width: 100%;
            max-width: 460px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 500;
            color: #111;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #888;
        }

        .pay-amount-badge {
            background: #F0F4FF;
            color: #00AAEE;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 500;
            font-size: 1.1rem;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 900px) {
            .hero-header-row {
                flex-direction: column;
                gap: 24px;
                padding: 0;
            }
            .hero-headline {
                margin-left: 0;
            }
            .hero-meta-group {
                gap: 32px;
                margin-right: 0;
            }
            .hero-banner-container {
                height: 320px;
            }
            .content-section {
                flex-direction: column;
                gap: 24px;
            }
            .section-title {
                white-space: normal;
                flex: none;
                width: 100%;
                padding-right: 0;
            }
            .section-right-content {
                flex: none;
                width: 100%;
            }
            .agenda-row {
                flex-direction: column;
                gap: 16px;
            }
            .agenda-date-col {
                flex: none;
            }
            .about-media-container, .guest-media-container, .sponsor-media-container {
                max-width: 100%;
                height: 280px;
            }
            .reg-hero-container {
                flex-direction: column;
                gap: 28px;
            }
            .reg-image-container {
                width: 100%;
                height: 240px;
